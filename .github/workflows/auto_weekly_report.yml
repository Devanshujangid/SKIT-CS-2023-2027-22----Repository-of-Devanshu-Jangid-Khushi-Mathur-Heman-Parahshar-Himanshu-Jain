name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Runs every Thursday at 11:59 PM IST (which corresponds to 18:29 UTC)
    # Cron format: min hour day-of-month month day-of-week (4 = Thursday)
    - cron: '29 18 * * 4'
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PDF & Graph Dependencies
        run: |
          pip install reportlab matplotlib

      - name: Generate Weekly PDF Report
        run: |
          python generate_report.py weekly

      - name: Move PDF to Weekly Reports Directory
        run: |
          mkdir -p weekly_reports
          mv *_Weekly_Progress_Report_Form-3_*.pdf weekly_reports/

      - name: Create pull request for weekly report
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: archive Form-3 weekly progress report [skip ci]"
          title: "docs: archive Form-3 weekly progress report"
          body: "Automated weekly report archival generated by GitHub Actions."
          branch: "automation/weekly-progress-report"
          delete-branch: true
          add-paths: |
            weekly_reports/
